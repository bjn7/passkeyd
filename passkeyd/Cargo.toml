[package]
name = "passkeyd"
version = "1.0.0"
edition = "2024"

[dependencies]
uhidrs-sys = "1.0.4"
enumflags2 = "^0.7.8"
libc = "^0.2.150"
cosey= "0.3.2"
ctaphid-types = "0.2.0"
anyhow = "1.0.100"
rand = "0.9.2"
ctap-types.workspace = true
log = "0.4.29"
env_logger = "0.11.8"
tss-esapi = "7.6.0"
thiserror = "2.0.18"
sha2 = { version = "0.10.9", features = ["oid"] }
hex="0.4.2"
p256={ version = "0.13.2", features = ["arithmetic", "ecdh", "serde"] }
der = { version = "0.7.10", features = ["derive", "std"] }
ureq = "3.2.0"
bytes = { workspace = true, features = ["serde"] }
serde = { workspace = true, features=["derive"] }
pam.workspace = true
passkeyd-abi = { path = "../passkeyd-abi" }
passkeyd-locale = { path = "../passkeyd-locale" }
rsa = { version = "0.9.10", features = ["serde"] }
